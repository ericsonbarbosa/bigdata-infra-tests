# Inventário é POR PROJETO: passe -i inventory/<projeto> na CLI.
# Não fixamos aqui para o mesmo repo atender N projetos (madalena, goodview, ...)
[defaults]
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
deprecation_warnings = False
timeout = 30
forks = 10

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no