---
# Configuração para MongoDB via Docker
mongo_docker_container_name: "mongodb"
mongo_port: 27017
mongo_bind_external_check: true

# Comando de saúde interna (mongosh é o shell padrão do mongo:8.0)
mongo_healthcheck_cmd: "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
mongo_version_cmd: "mongosh --quiet --eval 'db.version()'"