---
- name: Coletar fatos de serviços (systemd)
  ansible.builtin.service_facts:

- name: Assert — serviço {{ mongo_service }} running e enabled
  ansible.builtin.assert:
    that:
      - ansible_facts.services[mongo_service ~ '.service'] is defined
      - ansible_facts.services[mongo_service ~ '.service'].state == 'running'
      - ansible_facts.services[mongo_service ~ '.service'].status == 'enabled'
    fail_msg: "FAIL: {{ mongo_service }}.service não está running/enabled"
    success_msg: "OK: systemd — {{ mongo_service }}.service running e enabled"

- name: Assert — porta {{ mongo_port }} aceitando conexões locais
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ mongo_port }}"
    timeout: 15
    msg: "FAIL: porta {{ mongo_port }} não aceita conexões locais em 15s"

- name: Ler bindIp do mongod.conf
  ansible.builtin.slurp:
    src: "{{ mongo_conf }}"
  register: mongo_conf_raw

- name: Assert — bindIp confere com o esperado
  ansible.builtin.assert:
    that:
      - mongo_expected_bind_ip in (mongo_conf_raw.content | b64decode)
    fail_msg: "FAIL: bindIp esperado '{{ mongo_expected_bind_ip }}' não encontrado em {{ mongo_conf }}"
    success_msg: "OK: bind — bindIp esperado presente no config"
  when: mongo_expected_bind_ip | length > 0

- name: Consulta simples de teste (ping sem auth)
  ansible.builtin.command:
    cmd: "{{ mongo_shell_bin }} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\""
  register: mongo_ping
  changed_when: false
  failed_when: mongo_ping.rc != 0 or (mongo_ping.stdout | trim) != '1'
  when: not (mongo_test_auth | bool)

- name: Consulta simples de teste (ping autenticado)
  ansible.builtin.command:
    cmd: >-
      {{ mongo_shell_bin }} --quiet -u {{ mongo_admin_user }}
      -p {{ vault_mongo_admin_password }} --authenticationDatabase admin
      --eval "db.adminCommand({ ping: 1 }).ok"
  no_log: true
  register: mongo_ping_auth
  changed_when: false
  failed_when: mongo_ping_auth.rc != 0 or (mongo_ping_auth.stdout | trim) != '1'
  when: mongo_test_auth | bool

- name: Registrar versão do MongoDB
  ansible.builtin.command:
    cmd: "{{ mongo_shell_bin }} --quiet --eval \"db.version()\""
  register: mongo_version
  changed_when: false

- name: Resultado — instalação e consulta OK
  ansible.builtin.debug:
    msg: "OK: ping OK | MongoDB {{ mongo_version.stdout | trim }}"

- name: Assert — bind externo acessível do nó de controle
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ mongo_port }}"
    timeout: 15
  delegate_to: localhost
  become: false
  when: mongo_bind_external_check | bool