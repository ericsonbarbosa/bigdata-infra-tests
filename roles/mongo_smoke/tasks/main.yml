---
# ==============================================================================
# FASE 2 — Smoke Tests do MongoDB
# Objetivo: Validar saúde, bind e resposta básica do banco de dados.
# ==============================================================================

# ==============================================================================
# BLOCO 1: SISTEMA E SERVIÇO (Systemd)
# ==============================================================================
- name: Consultar estado atual do serviço (is-active)
  ansible.builtin.command:
    cmd: systemctl is-active {{ mongo_service }}.service
  register: mongo_active
  changed_when: false
  failed_when: false

- name: Consultar estado de inicialização do serviço (is-enabled)
  ansible.builtin.command:
    cmd: systemctl is-enabled {{ mongo_service }}.service
  register: mongo_enabled
  changed_when: false
  failed_when: false

- name: Assert — serviço {{ mongo_service }} running e enabled
  ansible.builtin.assert:
    that:
      - (mongo_active | default({})).stdout | default('') | trim == 'active'
      - (mongo_enabled | default({})).stdout | default('') | trim == 'enabled'
    fail_msg: >-
      FAIL: {{ mongo_service }}.service
      active={{ (mongo_active | default({})).stdout | default('n/d') | trim }}
      enabled={{ (mongo_enabled | default({})).stdout | default('n/d') | trim }}
    success_msg: "OK: systemd — {{ mongo_service }}.service running e enabled"

# ==============================================================================
# BLOCO 2: REDE LOCAL (Porta)
# ==============================================================================
- name: Assert — porta {{ mongo_port }} aceitando conexões locais
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ mongo_port }}"
    timeout: 15
    msg: "FAIL: porta {{ mongo_port }} não aceita conexões locais em 15s"

# ==============================================================================
# BLOCO 3: CONFIGURAÇÃO (Bind IP)
# ==============================================================================
- name: Ler bindIp do mongod.conf
  ansible.builtin.slurp:
    src: "{{ mongo_conf }}"
  register: mongo_conf_raw

- name: Assert — bindIp confere com o esperado
  ansible.builtin.assert:
    that:
      - mongo_expected_bind_ip in (mongo_conf_raw.content | b64decode)
    fail_msg: "FAIL: bindIp esperado '{{ mongo_expected_bind_ip }}' não encontrado em {{ mongo_conf }}"
    success_msg: "OK: config — bindIp esperado presente no mongod.conf"
  when: mongo_expected_bind_ip | length > 0

# ==============================================================================
# BLOCO 4: SAÚDE DO BANCO (Ping)
# ==============================================================================
- name: Consulta simples de teste (db.adminCommand ping)
  ansible.builtin.command:
    cmd: "{{ mongo_shell_bin }} --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
  register: mongo_ping
  changed_when: false
  failed_when: mongo_ping.rc != 0 or (mongo_ping.stdout | trim) != '1'
  when: not (mongo_test_auth | bool)

- name: Assert — MongoDB respondeu ao ping com sucesso
  ansible.builtin.assert:
    that:
      - (mongo_ping.stdout | trim) == '1'
    fail_msg: "FAIL: MongoDB não respondeu ao ping (rc={{ mongo_ping.rc }}, out={{ mongo_ping.stdout }})"
    success_msg: "OK: saúde — MongoDB respondeu ao ping"
  when: not (mongo_test_auth | bool)

# ==============================================================================
# BLOCO 5: VERSÃO (Informação)
# ==============================================================================
- name: Registrar versão do MongoDB
  ansible.builtin.command:
    cmd: "{{ mongo_shell_bin }} --quiet --eval 'db.version()'"
  register: mongo_version
  changed_when: false

- name: Resultado — instalação e versão
  ansible.builtin.debug:
    msg: "OK: MongoDB {{ mongo_version.stdout | trim }} está operacional"