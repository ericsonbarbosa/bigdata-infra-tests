---
# ==============================================================================
# CANÁRIOS — REGISTRO VIVO DOS BUGS A–I (alertam antes do fix, silenciam depois)
# ==============================================================================
- name: Canário A — scripts que ainda leem /var/lib/pdi (inexistente)
  ansible.builtin.shell: |
    grep -l "/var/lib/pdi" {{ scripts_base_path }}/*.sh || true
  register: can_a
  changed_when: false

- name: Status A
  ansible.builtin.debug:
    msg: >-
      {{ 'OK: bug A corrigido — nenhum script referencia /var/lib/pdi.' if (can_a.stdout | length == 0)
         else '⚠️ BUG A presente em: ' + (can_a.stdout_lines | join(', ')) }}

- name: Canário B — scripts que chamam binário hadoop-2.7.7 (inexistente)
  ansible.builtin.shell: |
    grep -l "hadoop-2.7.7" {{ scripts_base_path }}/*.sh || true
  register: can_b
  changed_when: false

- name: Status B
  ansible.builtin.debug:
    msg: >-
      {{ 'OK: bug B corrigido — nenhum script referencia o binário legado.' if (can_b.stdout | length == 0)
         else '⚠️ BUG B presente em: ' + (can_b.stdout_lines | join(', ')) + ' (falha silenciosa: exit 0 sem executar nada)' }}

- name: Canário C — linha --file ativa em run_shell.sh
  ansible.builtin.shell: |
    grep -E '^[^#]*--file' {{ scripts_base_path }}/run_shell.sh || true
  register: can_c
  changed_when: false

- name: Status C
  ansible.builtin.debug:
    msg: >-
      {{ 'OK: bug C corrigido — run_shell.sh passa --file ao Trino CLI.' if (can_c.stdout | length > 0)
         else '⚠️ BUG C presente: --file comentado no run_shell.sh (CLI pendura aguardando senha)' }}

- name: Canário D — guard de $2 no shellhadoopdeleten.sh
  ansible.builtin.shell: |
    grep -c 'caminho obrigatorio' {{ scripts_base_path }}/shellhadoopdeleten.sh || true
  register: can_d
  changed_when: false

- name: Status D
  ansible.builtin.debug:
    msg: >-
      {{ 'OK: bug D corrigido — guard de $2 presente no deleten.' if ((can_d.stdout | trim | int) > 0)
         else '⚠️ BUG D presente: deleten sem guard de $2 (risco de rm -r -skipTrash /*)' }}

- name: Canário E — pipe-while (subshell) no pipelinemove
  ansible.builtin.shell: |
    grep -c '| while' {{ scripts_base_path }}/shellhadooppipelinemove.sh || true
  register: can_e
  changed_when: false

- name: Status E
  ansible.builtin.debug:
    msg: >-
      {{ 'OK: bug E corrigido — MOVE_FALHOU não se perde mais (process substitution).' if ((can_e.stdout | trim | int) == 0)
         else '⚠️ BUG E presente: MOVE_FALHOU setado em subshell (sucesso falso no pipelinemove)' }}

- name: Canário F — cd validado no shelldelete.sh
  ansible.builtin.shell: |
    grep -cF 'cd /var/data/hadoop/dados ||' {{ scripts_base_path }}/shelldelete.sh || true
  register: can_f
  changed_when: false

- name: Status F
  ansible.builtin.debug:
    msg: >-
      {{ 'OK: bug F corrigido — cd validado no shelldelete.' if ((can_f.stdout | trim | int) > 0)
         else '⚠️ BUG F presente: cd sem validação (rm -f roda no dir do chamador se o cd falhar)' }}

- name: Canário H — scripts que ainda referenciam /home/pentaho/trino
  ansible.builtin.shell: |
    grep -l "/home/pentaho/trino" {{ scripts_base_path }}/*.sh || true
  register: can_h
  changed_when: false

- name: Canário H — o caminho legado existe?
  ansible.builtin.stat:
    path: /home/pentaho/trino
  register: legacy_trino_bin

- name: Status H
  ansible.builtin.debug:
    msg: >-
      {{ 'OK: nenhum script referencia o caminho legado /home/pentaho/trino.' if (can_h.stdout | length == 0)
         else ('⚠️ BUG H: ' + (can_h.stdout_lines | join(', ')) + ' referenciam /home/pentaho/trino (inexistente); CLI real em ' + trino_cli_bin + '.') if not legacy_trino_bin.stat.exists
         else 'OK: /home/pentaho/trino existe (caminho legado ainda válido).' }}

- name: Canário I — wrapper run_trino.sh com placeholder literal
  ansible.builtin.shell: |
    grep -c 'CONFIG_DIR' /opt/trino/trino_scripts/run_trino.sh 2>/dev/null || true
  register: can_i
  changed_when: false

- name: Status I
  ansible.builtin.debug:
    msg: >-
      {{ 'OK: bug I corrigido — run_trino.sh sem placeholders Jinja literais.' if ((can_i.stdout | trim | int) == 0)
         else '⚠️ BUG I presente: run_trino.sh tem placeholder {{ CONFIG_DIR }} não processado → CLI falha ao abrir truststore' }}

- name: Status G — contratos soltos (informativo, sem teste)
  ansible.builtin.debug:
    msg: >-
      ℹ️ BUG G (baixa): shellhadoopdeleten.sh ignora $1; shellhadooptruncate.sh ignora $2..$4.
      Documentar uso ou limpar variáveis mortas no próximo change.