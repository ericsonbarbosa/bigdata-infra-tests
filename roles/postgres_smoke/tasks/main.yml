---
# ==============================================================================
# FASE 2 — Smoke Tests do PostgreSQL (Docker)
# Objetivo: Validar daemon Docker, status do container e saúde do banco.
# ==============================================================================

# ==============================================================================
# BLOCO 1: DOCKER DAEMON
# Objetivo: Garantir que o motor de containers está vivo.
# ==============================================================================
- name: Consultar estado do serviço Docker (is-active)
  ansible.builtin.command:
    cmd: systemctl is-active docker.service
  register: docker_active
  changed_when: false
  failed_when: false

- name: Assert — Docker daemon running
  ansible.builtin.assert:
    that:
      - (docker_active | default({})).stdout | default('') | trim == 'active'
    fail_msg: "FAIL: Docker daemon não está ativo"
    success_msg: "OK: Docker daemon está ativo"

# ==============================================================================
# BLOCO 2: STATUS DO CONTAINER
# Objetivo: Verificar se o container específico do Postgres está rodando.
# ==============================================================================
- name: Inspecionar status do container {{ pg_docker_container_name }}
  ansible.builtin.command:
    cmd: "docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' {{ pg_docker_container_name }}"
  register: container_status
  changed_when: false
  failed_when: container_status.rc != 0

- name: Assert — Container {{ pg_docker_container_name }} está rodando
  ansible.builtin.assert:
    that:
      - container_status.stdout | trim == 'running'
    fail_msg: "FAIL: Container {{ pg_docker_container_name }} status: {{ container_status.stdout | trim }}"
    success_msg: "OK: Container {{ pg_docker_container_name }} está running"

# ==============================================================================
# BLOCO 3: REDE (Porta)
# Objetivo: Validar se a porta 5432 está exposta e acessível.
# ==============================================================================
- name: Assert — porta {{ pg_port }} aceitando conexões
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ pg_port }}"
    timeout: 15
    msg: "FAIL: porta {{ pg_port }} não responde"

# ==============================================================================
# BLOCO 4: SAÚDE INTERNA DO BANCO (pg_isready)
# Objetivo: Executar comando nativo dentro do container para validar o Postgres.
# ==============================================================================
- name: Executar pg_isready dentro do container
  ansible.builtin.command:
    cmd: docker exec {{ pg_docker_container_name }} {{ pg_healthcheck_cmd }}
  register: pg_health
  changed_when: false
  # pg_isready retorna 0 se OK, 1 se não aceita, 2 se sem resposta
  failed_when: pg_health.rc != 0

- name: Assert — PostgreSQL aceitando conexões internas
  ansible.builtin.assert:
    that:
      - pg_health.rc == 0
    fail_msg: "FAIL: pg_isready retornou erro: {{ pg_health.stderr | default(pg_health.stdout) }}"
    success_msg: "OK: PostgreSQL aceitando conexões ({{ pg_health.stdout | trim }})"