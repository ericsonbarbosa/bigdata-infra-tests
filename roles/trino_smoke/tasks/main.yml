---
# ==============================================================================
# FASE 1 — Smoke Tests do Trino
# Objetivo: Validar saúde, configuração e integração básica do nó Trino.
# ==============================================================================

# ==============================================================================
# BLOCO 1: SISTEMA E SERVIÇO (Systemd)
# Objetivo: Garantir que o serviço está ativo e configurado para iniciar no boot.
# ==============================================================================
- name: Coletar fatos de serviços (systemd)
  ansible.builtin.service_facts:

- name: Assert — serviço {{ trino_service }} running e enabled
  ansible.builtin.assert:
    that:
      - ansible_facts.services[trino_service ~ '.service'] is defined
      - ansible_facts.services[trino_service ~ '.service'].state == 'running'
      - ansible_facts.services[trino_service ~ '.service'].status == 'enabled'
    fail_msg: "FAIL: {{ trino_service }}.service não está running/enabled"
    success_msg: "OK: systemd — {{ trino_service }}.service running e enabled"

# ==============================================================================
# BLOCO 2: REDE LOCAL (Porta)
# Objetivo: Validar se a porta do Trino está ouvindo localmente (127.0.0.1).
# ==============================================================================
- name: Assert — porta {{ trino_port }} aceitando conexões
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ trino_port }}"
    timeout: 15
    msg: "FAIL: porta {{ trino_port }} não aceita conexões em 15s"

# ==============================================================================
# BLOCO 3: API REST E SAÚDE (URI / Payload)
# Objetivo: Consultar o endpoint /v1/info e validar a estrutura JSON e a versão.
# ==============================================================================
- name: GET /v1/info — endpoint REST do Trino
  ansible.builtin.uri:
    url: "{{ trino_scheme }}://127.0.0.1:{{ trino_port }}/v1/info"
    validate_certs: "{{ validate_certs }}"
    return_content: true
    status_code: 200
  register: trino_info

- name: Assert — payload de /v1/info coerente
  ansible.builtin.assert:
    that:
      - trino_info.json.nodeVersion is defined
      - trino_info.json.environment is defined
      - trino_info.json.state == 'ACTIVE'
    fail_msg: "FAIL: payload inesperado em /v1/info: {{ trino_info.json }}"
    success_msg: "OK: REST — /v1/info 200 (version={{ trino_info.json.nodeVersion.version }}, state={{ trino_info.json.state }})"

- name: Assert — versão ativa confere com a esperada
  ansible.builtin.assert:
    that:
      - trino_info.json.nodeVersion.version == trino_expected_version
    fail_msg: >-
      FAIL: Trino ativo é {{ trino_info.json.nodeVersion.version }},
      esperado {{ trino_expected_version }}.
      O serviço aponta para outro install? (systemctl cat {{ trino_service }})
    success_msg: "OK: versão ativa {{ trino_info.json.nodeVersion.version }} confere"

# ==============================================================================
# BLOCO 4: CONFIGURAÇÃO E DRIFT (Arquivos)
# Objetivo: Ler o arquivo de config e garantir que o wiring com o OPA não foi alterado.
# ==============================================================================
- name: Ler access-control.properties (drift test)
  ansible.builtin.slurp:
    src: "{{ trino_home }}/etc/access-control.properties"
  register: ac_props

- name: Assert — wiring OPA presente na config do Trino
  ansible.builtin.assert:
    that:
      - "'access-control.name=opa' in (ac_props.content | b64decode)"
      - "'opa.policy.uri=' in (ac_props.content | b64decode)"
      - "'opa.policy.column-masking-uri=' in (ac_props.content | b64decode)"
      - "'opa.policy.row-filters-uri=' in (ac_props.content | b64decode)"
    fail_msg: "FAIL: access-control.properties sem wiring OPA completo (drift detectado)"
    success_msg: "OK: config — access-control.properties com wiring OPA completo"

# ==============================================================================
# BLOCO 5: INTEGRAÇÃO PONTA A PONTA (Trino -> OPA)
# Objetivo: Simular uma consulta real e validar se o OPA responde 'allow' (Opcional).
# ==============================================================================
- name: Probe — OPA responde allow para conta de serviço
  ansible.builtin.uri:
    url: "{{ opa_base }}/v1/data/portal/authz/allow"
    method: POST
    body_format: json
    body:
      input:
        context:
          identity:
            user: "{{ probe_service_account }}"
        action:
          operation: SelectFromColumns
          resource:
            table:
              catalogName: "{{ probe_catalog }}"
              schemaName: "{{ probe_schema }}"
              tableName: "{{ probe_table }}"
              columns: "{{ probe_columns }}"
    status_code: 200
  register: opa_allow
  delegate_to: localhost
  become: false
  when: smoke_opa_probe | bool

- name: Assert — OPA allow=true para conta de serviço
  ansible.builtin.assert:
    that:
      - opa_allow.json.result | default(false) | bool
    fail_msg: "FAIL: OPA não liberou {{ probe_service_account }}"
    success_msg: "OK: integração — OPA allow=true"
  delegate_to: localhost
  become: false
  when: smoke_opa_probe | bool